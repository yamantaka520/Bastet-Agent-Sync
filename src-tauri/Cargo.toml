[package]
name = "bastet-agent-sync"
version = "0.6.0"
description = "Bastet Agent Sync desktop companion"
authors = ["Bastet contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yamantaka520/Bastet-Agent-Sync"

[lib]
name = "bastet_agent_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
mac-app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
tempfile = "3"

sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
chacha20poly1305 = "0.10.1"
base64 = "0.22"
zeroize = "1"
rand = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
webbrowser = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tauri-plugin-updater = "2"

flate2 = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }

chrono = { version = "0.4", default-features = false, features = ["clock"] }

toml = "0.8"
unicode-normalization = "0.1"
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSData", "NSError", "NSString", "NSArray"] }
