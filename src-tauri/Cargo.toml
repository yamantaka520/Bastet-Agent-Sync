[package]
name = "bastet-agent-sync"
version = "0.1.0"
description = "Bastet Agent Sync desktop companion"
authors = ["Bastet contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yamantaka520/Bastet-Agent-Sync"

[lib]
name = "bastet_agent_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
tempfile = "3"

sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
