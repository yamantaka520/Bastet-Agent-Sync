name: Desktop release packages
on:
  workflow_dispatch:
    inputs:
      windows_signing:
        description: Windows publisher signing policy (deferred publishes unsigned Windows installers)
        required: true
        type: choice
        default: required
        options: [required, deferred]
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm
      - run: npm ci
      - run: npm test
      - run: python scripts/check_docs.py
      - run: python scripts/test_release_assets.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installers and signed updater archives
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Sign native Linux package updates
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          for package in src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm; do
            npx tauri signer sign "$package"
          done
      - name: Collect packages
        run: python scripts/release_assets.py collect --target ${{ matrix.target }}
      - name: Check Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -I release-assets/*.deb
          sudo apt-get install -y ./release-assets/*.deb
          ldd /usr/bin/bastet-agent-sync | tee /tmp/bastet-libraries.txt
          ! grep 'not found' /tmp/bastet-libraries.txt
          rpm -qp --requires release-assets/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  macos:
    permissions:
      contents: read
    uses: ./.github/workflows/macos-signing.yml
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  windows:
    if: inputs.windows_signing == 'required'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-signing.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  windows-deferred:
    if: github.ref == 'refs/heads/main' && inputs.windows_signing == 'deferred'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-x86_64-pc-windows-msvc
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: python scripts/check_docs.py
      - run: python scripts/test_release_assets.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows packages with publisher signing explicitly deferred
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Collect packages and disclose signing status
        shell: pwsh
        run: |
          python scripts/release_assets.py collect --target x86_64-pc-windows-msvc
          'Windows Authenticode is explicitly deferred. Updater signatures and installer smoke checks are still required. These packages do not establish Windows publisher trust.' >> $env:GITHUB_STEP_SUMMARY
      - name: Verify deferred Windows installers and native launch
        shell: pwsh
        run: |
          $expected = [version]((Get-Content package.json -Raw | ConvertFrom-Json).version)
          function Assert-Executable([string]$path) {
            $file = Get-Item -LiteralPath $path
            $actual = [version]$file.VersionInfo.ProductVersion
            if ($actual.Major -ne $expected.Major -or $actual.Minor -ne $expected.Minor -or $actual.Build -ne $expected.Build) {
              throw "Application version mismatch: $($file.Name)"
            }
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Missing PE DOS header: $($file.Name)" }
              [void]$stream.Seek(0x3C, [IO.SeekOrigin]::Begin)
              $peOffset = $reader.ReadInt32()
              [void]$stream.Seek($peOffset, [IO.SeekOrigin]::Begin)
              if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0x8664) {
                throw "Application is not an x64 PE executable: $($file.Name)"
              }
            } finally { $stream.Dispose() }
          }
          function Assert-Launch([string]$path) {
            $app = Start-Process -FilePath $path -PassThru
            try {
              Start-Sleep -Seconds 10
              $app.Refresh()
              if ($app.HasExited) { throw 'Installed application exited during launch check' }
            } finally {
              $app.Refresh()
              if (!$app.HasExited) { Stop-Process -Id $app.Id }
            }
          }
          $installer = @(Get-ChildItem release-assets/*.exe)
          $msi = @(Get-ChildItem release-assets/*.msi)
          if ($installer.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected NSIS and MSI installers' }
          $destination = Join-Path $env:RUNNER_TEMP 'BastetDeferredSmoke'
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $binary = Join-Path $destination 'bastet-agent-sync.exe'
          if (!(Test-Path $binary)) { throw 'Installed executable missing' }
          Assert-Executable $binary
          Assert-Launch $binary
          $expanded = Join-Path $env:RUNNER_TEMP 'BastetDeferredMsi'
          $extract = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$expanded`"" -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw "MSI extraction failed: $($extract.ExitCode)" }
          $inner = @(Get-ChildItem $expanded -Recurse -Filter bastet-agent-sync.exe)
          if ($inner.Count -ne 1) { throw 'Expected one application inside MSI' }
          Assert-Executable $inner[0].FullName
          Assert-Launch $inner[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: packages-x86_64-pc-windows-msvc
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [build, macos, windows, windows-deferred]
    if: >-
      always() && needs.build.result == 'success' && needs.macos.result == 'success' &&
      ((inputs.windows_signing == 'required' && needs.windows.result == 'success') ||
       (inputs.windows_signing == 'deferred' && needs.windows-deferred.result == 'success'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Validate all platforms and create release metadata
        run: python3 scripts/release_assets.py prepare
      - name: Upload complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_assets.py draft
