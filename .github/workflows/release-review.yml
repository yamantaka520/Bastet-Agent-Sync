name: Prepare reviewed release metadata
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop release packages run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-metadata-review
  cancel-in-progress: false
jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - run: npm ci
      - name: Sign native Linux package updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          for package in release-assets/*.deb release-assets/*.rpm; do
            npx tauri signer sign "$package"
          done
      - run: python scripts/test_release_assets.py
      - run: python scripts/release_assets.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-release
          path: release-assets/*
          if-no-files-found: error
